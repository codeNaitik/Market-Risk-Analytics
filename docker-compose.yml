# Local stack: Kafka (KRaft, no ZooKeeper) + Kafka UI + Airflow.
#   docker compose up -d            -> Kafka on localhost:9092, Kafka UI :8081, Airflow :8080
#   docker compose down -v          -> stop and wipe volumes
#
# Spark runs in-process (pip install pyspark) on your machine or inside the Airflow
# container, so no Spark cluster container is needed for the local demo.

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: mra-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168          # keep 7 days so the stream can be replayed
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on: {kafka: {condition: service_healthy}}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
      --topic crypto.trades.raw --partitions 3 --replication-factor 1
      --config retention.ms=604800000 --config compression.type=lz4"
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: mra-kafka-ui
    depends_on: {kafka: {condition: service_healthy}}
    ports: ["8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  airflow:
    build: {context: ., dockerfile: docker/airflow/Dockerfile}
    container_name: mra-airflow
    command: standalone
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/repo/airflow/dags
      MRA_RUN_MODE: local
      LAKE_ROOT: /opt/airflow/repo/lake
      KAFKA_BOOTSTRAP: kafka:29092
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/opt/airflow/repo
    depends_on: {kafka: {condition: service_healthy}}

volumes:
  kafka-data:
